<!DOCTYPE html><html lang="ja"> <head>  <meta charset="UTF-8">  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>Global Strategy: Secure Ultimate Complete</title>  
  <!-- Fonts -->  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">  
  <!-- Libraries -->  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css"/>  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>  <script src="https://unpkg.com/@turf/turf/turf.min.js"></script>
<style>
    :root { --bg-color: #050505; --panel-bg: rgba(15, 20, 25, 0.95); --neon-blue: #00f3ff; --neon-red: #ff0055; --neon-green: #00ff99; --neon-gold: #ffcc00; }
    body { font-family: 'Noto Sans JP', sans-serif; background-color: var(--bg-color); color: #e0e6ed; margin: 0; padding: 0; height: 100vh; overflow: hidden; }
    .app-container { display: flex; height: 100%; }
    .map-section { flex: 1; position: relative; }
    #gameMap { width: 100%; height: 100%; background: #0b0b0b; }
    .sidebar { width: 360px; background: var(--panel-bg); border-left: 1px solid #333; display: flex; flex-direction: column; padding: 15px; box-shadow: -5px 0 20px rgba(0,0,0,0.8); z-index: 100; overflow-y: auto; }
    h1 { color: var(--neon-blue); text-align: center; font-family: 'Orbitron'; font-size: 1.4em; border-bottom: 2px solid var(--neon-blue); padding-bottom: 10px; margin-top: 0; }
    h3 { color: var(--neon-gold); font-size: 0.9em; margin-top: 15px; border-left: 3px solid var(--neon-gold); padding-left: 8px; font-family: 'Orbitron'; }
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 15px; }
    .stat-card { background: #1a1a1a; padding: 8px; border-radius: 4px; text-align: center; border: 1px solid #333; }
    .stat-val { font-family: 'Orbitron'; font-size: 1.1em; color: white; display: block; }
    .stat-label { font-size: 0.7em; color: #888; }
    button { width: 100%; padding: 10px; margin-bottom: 5px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-family: 'Noto Sans JP'; transition: 0.2s; }
    button:hover { filter: brightness(1.2); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-main { background: var(--neon-blue); color: black; }
    .btn-war { background: var(--neon-red); color: white; }
    .btn-buy { background: var(--neon-green); color: black; }
    .btn-sub { background: #333; color: #ccc; }
    input { background: #222; border: 1px solid #555; color: white; padding: 10px; width: 100%; box-sizing: border-box; margin-bottom: 10px; }
    .tabs { display: flex; gap: 2px; margin-bottom: 10px; }
    .tab { flex: 1; padding: 8px; background: #222; color: #888; text-align: center; cursor: pointer; font-size: 0.7em; }
    .tab.active { background: #333; color: var(--neon-blue); border-bottom: 2px solid var(--neon-blue); }
    .rank-item { display: flex; align-items: center; gap: 10px; padding: 8px; border-bottom: 1px solid #222; font-size: 0.85em;}
    .rank-num { font-family: 'Orbitron'; color: var(--neon-gold); width: 20px; font-weight: bold;}
    canvas { border: 1px solid #555; background: #000; cursor: crosshair; image-rendering: pixelated; margin: 0 auto; display: block;}
    .palette { display: flex; justify-content: center; gap: 5px; margin-top: 5px; flex-wrap: wrap;}
    .color-dot { width: 20px; height: 20px; border-radius: 50%; border: 1px solid #fff; cursor: pointer; }
    .pop-flag { width: 80px; height: 50px; border: 1px solid #ccc; display: block; margin: 0 auto 5px auto; image-rendering: pixelated; }
    .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 9999; display: flex; justify-content: center; align-items: center; }
    .modal { background: #111; border: 1px solid var(--neon-blue); padding: 30px; width: 400px; max-width: 90%; text-align: center; border-radius: 8px; }
    .hidden { display: none !important; }
    #adminPanel { position: fixed; top: 5%; left: 5%; width: 90%; height: 90%; background: #000; border: 2px solid var(--neon-red); z-index: 10000; padding: 20px; overflow-y: auto; color: var(--neon-red); box-sizing: border-box; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; color: #ccc; font-size: 0.85em; }
    th, td { border: 1px solid #333; padding: 8px; text-align: center; }
    .admin-edit-btn { background: #333; color: #00f3ff; border: 1px solid #555; padding: 2px 5px; font-size: 0.8em; cursor: pointer; }
  </style>
</head> <body><div id="overlayStart" class="overlay">  <div id="menuMain" class="modal">    <h1>Global Strategy</h1>    <p style="color:#aaa;">領土争奪・国家運営シミュレーション</p>    <div id="loadingMsg" style="color:var(--neon-green); margin-bottom:10px; display:none;">自動ログイン中...</div>    <button class="btn-main" onclick="showScreen('Register')">🌍 新規建国</button>    <button class="btn-buy" onclick="showScreen('Login')">🔑 ログイン</button>  </div>
  <div id="menuRegister" class="modal hidden">    <h2>新規建国</h2> <input type="text" id="regName" placeholder="国名"> <input type="password" id="regPass" placeholder="パスワード"> <button class="btn-main" onclick="register()">作成</button> <button class="btn-sub" onclick="showScreen('Main')">戻る</button> </div>
  <div id="menuLogin" class="modal hidden">    <h2>ログイン</h2> <input type="text" id="loginName" placeholder="国名"> <input type="password" id="loginPass" placeholder="パスワード"> <button class="btn-buy" id="loginSubmitBtn" onclick="login()">入国</button> <button class="btn-sub" onclick="showScreen('Main')">戻る</button> </div>
</div><div id="overlayAdminAuth" class="overlay hidden"> <div class="modal" style="border-color:red;"> <h2>管理者認証</h2> <input type="password" id="adminKey" placeholder="Password"> <button class="btn-war" onclick="attemptAdminLogin()">UNLOCK</button> <button class="btn-sub" onclick="document.getElementById('overlayAdminAuth').classList.add('hidden')">戻る</button> </div> </div><div id="adminPanel" class="hidden">  <h2>⚠️ サーバー管理コンソール</h2>  <div style="margin-bottom:10px;"> <button class="btn-sub" style="width:100px;" onclick="closeAdmin()">閉じる</button> <button class="btn-main" style="width:150px;" onclick="refreshAdminList()">リスト更新</button> </div>  <table><thead><tr><th>国名</th><th>パス</th><th>資金</th><th>面積</th><th>GDP</th><th>軍事</th><th>操作</th></tr></thead><tbody id="adminTableBody"></tbody></table> </div><div id="gameUI" class="app-container hidden">  <div class="map-section"> <div id="gameMap"></div> <div id="mapMsg" style="position:absolute; top:20px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.9); padding:15px; border:2px solid var(--neon-gold); color:var(--neon-gold); display:none; z-index:1000; pointer-events:none;"><b>【領土描画モード】</b></div> </div>
  <div class="sidebar">    <h1><span id="uiName">NATION</span></h1>    <div class="stats-grid">
      <div class="stat-card"><span class="stat-label">資金</span><span class="stat-val" id="valMoney">0</span><span style="font-size:0.7em">$</span></div>
      <div class="stat-card"><span class="stat-label">面積</span><span class="stat-val" id="valArea">0</span><span style="font-size:0.7em">km²</span></div>
      <div class="stat-card"><span class="stat-label">GDP</span><span class="stat-val" id="valGDP">0</span><span style="font-size:0.7em">$</span></div>
      <div class="stat-card"><span class="stat-label">軍事力</span><span class="stat-val" id="valMil">0</span></div>
    </div>
    <div class="tabs"> <div class="tab active" onclick="setTab('main')">内政</div> <div class="tab" onclick="setTab('war')">軍事・外交</div> <div class="tab" onclick="setTab('rank')">順位</div> <div class="tab" onclick="setTab('flag')">国旗</div> </div>
    <div id="tab-main"> <h3>経済</h3> <button class="btn-main" onclick="invest()">🏭 産業投資 (-$2000)</button> <div style="margin-top:5px; font-size:0.8em;">所得税: <span id="taxVal">10</span>% <input type="range" id="taxRate" min="0" max="50" value="10" onchange="document.getElementById('taxVal').innerText=this.value"></div> <h3>領土</h3> <button class="btn-buy" onclick="startExpansion()">🗺️ 領土購入・描画</button> <button class="btn-sub" onclick="manualSave()">💾 サーバー保存</button> <button class="btn-sub" onclick="doLogout()">🚪 ログアウト</button> </div>
    <div id="tab-war" class="hidden"> <h3>軍備</h3> <button class="btn-war" onclick="recruit()">⚔️ 兵士雇用 (-$1000)</button> <h3>外交申請</h3> <div id="requestBox" style="background:#1a1a1a; padding:10px; border-radius:4px; margin-bottom:10px; font-size:0.85em; border:1px solid #333;">申請なし</div> <h3>ターゲット</h3> <div class="stat-card" style="text-align:left; margin-bottom:10px; border-color:var(--neon-red);">対象: <b id="targetName">なし</b><br>状態: <span id="targetStatus">---</span><br><div id="warAutoMsg" style="color:var(--neon-red); font-size:0.8em; display:none;">⚠️ 自動戦争進行中...</div></div> <button class="btn-buy" id="btnAlly" onclick="actionAlly()" disabled>🤝 同盟申請</button> <button class="btn-war" id="btnWar" onclick="actionWar()" disabled>💣 宣戦布告</button> </div>
    <div id="tab-rank" class="hidden"> <h3>世界国力ランキング</h3> <div id="rankingList"></div> </div>
    <div id="tab-flag" class="hidden"> <h3>国旗エディタ</h3> <canvas id="flagCanvas" width="100" height="60"></canvas> <div class="palette" id="paletteBox"></div> <button class="btn-main" onclick="saveFlag()">💾 保存</button> <button class="btn-sub" onclick="clearFlag()">🗑 クリア</button> </div>
    <div style="margin-top:auto; font-size:0.7em; color:#555; text-align:center;">Shift+Alt: Admin Panel</div>
  </div>
</div><script>
  const PANTRY_ID = "6ac44d17-1f5d-4931-a51f-9a540cca1ef7";
  const BASKET_NAME = "strategy_complete_final";
  const API_URL = `https://getpantry.cloud/apiv1/pantry/${}/basket/${}`;

  let myName = "", myData = {}, map, drawnItems, drawControl, selectedTarget = null, expansionMode = false;
  let lastWorldDataStr = ""; // 変更検知用
  let isSyncing = false; // 通信中フラグ

  window.onload = function() {
    const savedName = localStorage.getItem('autoName'), savedPass = localStorage.getItem('autoPass');
    if(savedName && savedPass) login(savedName, savedPass);
    
    // Liveインジケーター作成
    const liveInd = document.createElement('div');
    liveInd.id = 'liveIndicator';
    liveInd.style.cssText = "position:absolute; top:10px; left:60px; color:#00ff99; font-size:0.8em; z-index:9999; text-shadow:0 0 5px #00ff99; display:none;";
    liveInd.innerHTML = "● LIVE SYNC";
    document.body.appendChild(liveInd);
  };

  document.addEventListener('keydown', (e) => {
    if(e.shiftKey && e.altKey) {
      if(localStorage.getItem('adminSession') === 'active') {
        document.getElementById('adminPanel').classList.remove('hidden'); refreshAdminList();
      } else { document.getElementById('overlayAdminAuth').classList.remove('hidden'); }
    }
  });

  function showScreen(id) { ['Main','Register','Login'].forEach(n => document.getElementById('menu'+n).classList.add('hidden')); document.getElementById('menu'+id).classList.remove('hidden'); }
  function setTab(id) { document.querySelectorAll('[id^="tab-"]').forEach(e => e.classList.add('hidden')); document.getElementById('tab-'+id).classList.remove('hidden'); document.querySelectorAll('.tab').forEach(e => e.classList.remove('active')); event.target.classList.add('active'); if(id === 'rank') updateRanking(); if(id === 'flag') initFlagEditor(); }

  // --- 通信関連 (Real-time Core) ---
  async function getDB() { try { const r = await fetch(API_URL + "?t=" + new Date().getTime()); if(r.ok) return await r.json(); } catch(e){} return { nations: {} }; }
  
  // 安全な保存（競合回避：最新データを取得してからマージして保存）
  async function saveDBsafe(newData) {
    if(isSyncing) return; // 重複送信防止
    isSyncing = true; updateLiveStatus(true);
    try {
      const db = await getDB();
      // 自分のデータを最新のDBにマージ
      db.nations[myName] = newData;
      await fetch(API_URL, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(db) });
      myData = newData; // ローカル更新
    } catch(e) { console.error(e); }
    isSyncing = false; updateLiveStatus(false);
    syncWorld(); // 保存後即座に反映
  }

  // リアルタイムループ
  function startRealTimeSync() {
    document.getElementById('liveIndicator').style.display = 'block';
    setInterval(syncWorld, 2000); // 2秒ごとに同期
    setInterval(ecoTick, 5000);   // 5秒ごとに内政
  }

  function updateLiveStatus(sending) {
    const el = document.getElementById('liveIndicator');
    el.style.color = sending ? "#ff0055" : "#00ff99";
    el.innerHTML = sending ? "▲ SENDING..." : "● LIVE SYNC";
  }

  async function syncWorld() {
    if(isSyncing) return;
    const db = await getDB();
    if(!db.nations) return;

    // データが変更された場合のみマップを再描画（チラつき防止）
    const currentDataStr = JSON.stringify(db.nations);
    if(currentDataStr !== lastWorldDataStr) {
      renderWorld(db.nations);
      lastWorldDataStr = currentDataStr;
      
      // 自分の最新ステータスがサーバーにあれば同期（ただし操作中は除く）
      if(db.nations[myName] && !expansionMode) {
        // 資金などはローカル計算を優先したいが、戦争被害などはサーバー優先
        const serverMe = db.nations[myName];
        // 面積や戦争状態はサーバー正
        myData.area = serverMe.area;
        myData.geometries = serverMe.geometries;
        myData.warTarget = serverMe.warTarget;
        myData.requests = serverMe.requests;
        myData.allies = serverMe.allies;
        // 資金は同期ズレを防ぐため、大きく減っていたら（攻撃されたら）同期
        if(serverMe.money < myData.money - 5000) myData.money = serverMe.money; 
      }
      refreshUI();
      if(document.getElementById('tab-rank').classList.contains('hidden') === false) updateRanking(db);
    }
  }

  // --- アプリロジック ---

  async function register() {
    const n = document.getElementById('regName').value, p = document.getElementById('regPass').value;
    if(!n || !p) return alert("入力不足");
    const db = await getDB(); if(db.nations && db.nations[n]) return alert("既に使用されています");
    const newNation = { pass: p, money: 20000000, gdp: 5000, military: 500, area: 0, geometries: [], allies: [], requests: [], warTarget: null, flag: null };
    db.nations[n] = newNation;
    await fetch(API_URL, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(db) });
    alert("建国完了"); showScreen('Login');
  }

  async function login(an, ap) {
    const n = an || document.getElementById('loginName').value, p = ap || document.getElementById('loginPass').value;
    if(!n || !p) return;
    const db = await getDB(); const target = db.nations ? db.nations[n] : null;
    if(!target || target.pass !== p) { if(!an) alert("認証失敗"); return; }
    localStorage.setItem('autoName', n); localStorage.setItem('autoPass', p);
    myName = n; myData = target;
    // データ補正
    if(!myData.geometries) myData.geometries = []; 
    if(!myData.allies) myData.allies = []; 
    if(!myData.requests) myData.requests = [];
    
    document.getElementById('overlayStart').classList.add('hidden'); 
    document.getElementById('gameUI').classList.remove('hidden');
    initMap(); 
    startRealTimeSync(); // 同期開始
  }

  function initMap() {
    if(map) return;
    map = L.map('gameMap').setView([35, 135], 4);
    L.tileLayer('https://{}.basemaps.cartocdn.com/dark_all/{}/{}/{}{}.png').addTo(map);
    drawnItems = new L.FeatureGroup(); map.addLayer(drawnItems);
    map.on('popupopen', e => {
      const div = document.createElement('div'); div.innerHTML = e.popup.getContent();
      const target = div.querySelector('b') ? div.querySelector('b').innerText : "";
      if(target && target !== myName) selectTarget(target);
    });
  }

  function renderWorld(ns) {
    drawnItems.clearLayers(); if(!ns) return;
    Object.keys(ns).forEach(key => {
      const n = ns[key], isMe = (key === myName), isAlly = (myData.allies || []).includes(key), isWar = (myData.warTarget === key);
      let color = isMe ? "#00f3ff" : (isWar ? "#ff8800" : (isAlly ? "#00ff99" : "#ff0055"));
      const fImg = n.flag ? `<img src="${n.flag}" class="pop-flag">` : "";
      (n.geometries || []).forEach(geo => {
        L.geoJSON(geo, { style: { color: color, weight: 2, fillOpacity: 0.3 } })
        .bindPopup(`<div style="text-align:center;">${}<b>${}</b><br>軍事: ${n.military}</div>`).addTo(drawnItems);
      });
    });
  }

  // --- 領土購入 ---
  function startExpansion() {
    expansionMode = true; document.getElementById('mapMsg').style.display = 'block';
    if(drawControl) map.removeControl(drawControl);
    drawControl = new L.Control.Draw({ draw: { polygon: { allowIntersection: false }, rectangle:true, circle:false, marker:false, polyline:false }, edit: false });
    map.addControl(drawControl);
    
    map.off(L.Draw.Event.CREATED); // 重複登録防止
    map.on(L.Draw.Event.CREATED, async e => {
      if(!expansionMode) return;
      const newGeo = e.layer.toGeoJSON(); 
      const db = await getDB(); // 最新チェック
      let overlap = false;
      Object.keys(db.nations).forEach(k => { if(k !== myName) (db.nations[k].geometries || []).forEach(g => { if(turf.intersect(newGeo, g)) overlap = true; }); });
      if(overlap) { alert("他国領土と重複しています"); return; }
      
      const a = Math.round(L.GeometryUtil.geodesicArea(e.layer.getLatLngs()[0])/1000000);
      const cost = myData.area === 0 ? 0 : a * 100;
      
      if(myData.money >= cost && confirm(`費用 $${cost.toLocaleString()} で購入しますか？`)) {
        let current = [...myData.geometries, newGeo];
        try { let m = current[0]; for(let i=1; i<current.length; i++){ let r = turf.union(m, current[i]); if(r) m = r; } myData.geometries = [m]; }
        catch(err) { myData.geometries = current; }
        
        myData.money -= cost; 
        myData.area = 0; myData.geometries.forEach(g => { myData.area += Math.round(turf.area(g)/1000000); });
        
        await saveDBsafe(myData); // リロードなし保存
        alert("購入完了");
      }
      expansionMode = false; document.getElementById('mapMsg').style.display = 'none';
      if(drawControl) map.removeControl(drawControl);
    });
  }

  // --- UI & ランキング ---
  async function updateRanking(dbParam) {
    const db = dbParam || await getDB();
    if(!db.nations) return;
    const ranks = Object.keys(db.nations).map(k => {
      const n = db.nations[k]; const s = Math.floor(n.gdp + (n.military * 10) + (n.area / 100));
      return { name: k, score: s };
    }).sort((a, b) => b.score - a.score);
    const list = document.getElementById('rankingList'); list.innerHTML = "";
    ranks.slice(0, 10).forEach((r, i) => { list.innerHTML += `<div class="rank-item"><span class="rank-num">${i+1}</span><span class="rank-name">${r.name}</span><span class="rank-score">${r.score.toLocaleString()}</span></div>`; });
  }

  function refreshUI() {
    document.getElementById('valMoney').innerText = Math.floor(myData.money).toLocaleString();
    document.getElementById('valArea').innerText = myData.area.toLocaleString();
    document.getElementById('valGDP').innerText = Math.floor(myData.gdp).toLocaleString();
    document.getElementById('valMil').innerText = myData.military.toLocaleString();
    document.getElementById('uiName').innerText = myName;
    document.getElementById('btnWar').style.display = myData.warTarget ? 'none' : 'block';
    document.getElementById('warAutoMsg').style.display = myData.warTarget ? 'block' : 'none';
    
    const rb = document.getElementById('requestBox'); 
    let reqHtml = (myData.requests && myData.requests.length > 0) ? "" : "申請なし";
    (myData.requests || []).forEach(s => { reqHtml += `<div>${} <button class="admin-edit-btn" onclick="acceptRequest('${}')">承諾</button></div>`; });
    rb.innerHTML = reqHtml;
  }

  // --- ゲームループ ---
  async function ecoTick() { 
    if(!myData.gdp) return;
    // 内政計算
    myData.money += myData.gdp * (parseInt(document.getElementById('taxRate').value)/100); 
    if(myData.warTarget) await autoWarProcess();
    refreshUI(); 
    // 定期保存はしない（通信量節約のため、重要な変更時のみsaveDBsafeを呼ぶか、非常に長い間隔で行う）
  }

  async function autoWarProcess() {
    const db = await getDB();
    const enName = myData.warTarget;
    let en = db.nations[enName];
    
    if(!en) { myData.warTarget = null; return; }
    
    // 戦闘処理
    if(myData.military * (0.6 + Math.random()) > en.military * (0.6 + Math.random())) {
       // 勝利
       const sA = Math.floor(en.area * 0.1), sG = Math.floor(en.gdp * 0.1);
       en.area -= sA; myData.area += sA; en.gdp -= sG; myData.gdp += sG;
       
       if(en.geometries.length > 0) { 
        // 敵の領土を一つ奪う
        const stolen = en.geometries.pop();
        myData.geometries.push(stolen); 
        // 自分の領土とマージ
        try { let m = myData.geometries[0]; for(let i=1; i<myData.geometries.length; i++){ let r = turf.union(m, myData.geometries[i]); if(r) m = r; } myData.geometries = [m]; } catch(e){}
       }
       
       myData.military = Math.max(0, myData.military - 50); 
       en.military = Math.max(0, en.military - 100);
       
       if(en.area <= 50 || en.military <= 0) {
        alert(`${} を併合！`); 
        myData.area += en.area; 
        myData.geometries.push(...en.geometries);
        delete db.nations[enName]; 
        myData.warTarget = null; 
       } else {
         db.nations[enName] = en; // 敵の更新
       }
    } else { 
      myData.military = Math.max(0, myData.military - 100); 
    }
    
    // 両方のデータを更新して保存
    db.nations[myName] = myData; 
    await fetch(API_URL, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(db) });
    syncWorld();
  }

  // --- アクション ---
  function invest() { if(myData.money>=2000){myData.money-=2000; myData.gdp+=500; refreshUI(); saveDBsafe(myData);} }
  function recruit() { if(myData.money>=1000){myData.money-=1000; myData.military+=250; refreshUI(); saveDBsafe(myData);} }
  function manualSave() { saveDBsafe(myData); alert("サーバー保存完了"); }
  function doLogout() { localStorage.clear(); location.reload(); }

  function selectTarget(n) { selectedTarget = n; document.getElementById('targetName').innerText = n; document.getElementById('btnAlly').disabled = false; document.getElementById('btnWar').disabled = false; }
  
  async function actionAlly() { 
    if(!selectedTarget) return;
    const db = await getDB(); 
    if(!db.nations[selectedTarget].requests) db.nations[selectedTarget].requests = []; 
    if(!db.nations[selectedTarget].requests.includes(myName)) {
      db.nations[selectedTarget].requests.push(myName); 
      await fetch(API_URL, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(db) });
      alert("申請送信");
    }
  }
  
  async function acceptRequest(s) { 
    myData.requests = myData.requests.filter(r => r !== s); 
    myData.allies.push(s); 
    
    const db = await getDB();
    if(db.nations[s]) {
      if(!db.nations[s].allies) db.nations[s].allies = [];
      db.nations[s].allies.push(myName);
      db.nations[myName] = myData; // 自分も更新
      await fetch(API_URL, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(db) });
      refreshUI();
      syncWorld();
      alert(`同盟成立: ${}`);
    }
  }
  
  async function actionWar() { 
    if(confirm(`${} に宣戦布告？`)){ 
      myData.warTarget = selectedTarget; 
      saveDBsafe(myData);
    } 
  }
  
  // --- Admin ---
  function attemptAdminLogin() { if(document.getElementById('adminKey').value === "201305042020302") { localStorage.setItem('adminSession', 'active'); document.getElementById('adminPanel').classList.remove('hidden'); refreshAdminList(); } }
  function closeAdmin() { document.getElementById('adminPanel').classList.add('hidden'); }
  async function refreshAdminList() {
    const t = document.getElementById('adminTableBody'); t.innerHTML = ""; const db = await getDB();
    if(!db.nations) return;
    Object.keys(db.nations).forEach(k => {
      const n = db.nations[k];
      t.innerHTML += `<tr><td>${}</td>
      <td>${n.pass} <button class="admin-edit-btn" onclick="adminEdit('${}','pass','${n.pass}')">変</button></td>
      <td>${n.money} <button class="admin-edit-btn" onclick="adminEdit('${}','money',${n.money})">変</button></td>
      <td>${n.area} <button class="admin-edit-btn" onclick="adminEdit('${}','area',${n.area})">変</button></td>
      <td>${n.gdp} <button class="admin-edit-btn" onclick="adminEdit('${}','gdp',${n.gdp})">変</button></td>
      <td>${n.military} <button class="admin-edit-btn" onclick="adminEdit('${}','military',${n.military})">変</button></td>
      <td><button onclick="del('${}')" style="background:red; color:white;">消</button></td></tr>`;
    });
  }
  async function adminEdit(c,k,v){ let n=prompt("変更後",v); if(n!==null){ const db=await getDB(); db.nations[c][k]=(k==='pass'?n:Number(n)); await fetch(API_URL, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(db) }); refreshAdminList(); }}
  async function del(n){ if(confirm("削除？")){ const db=await getDB(); delete db.nations[n]; await fetch(API_URL, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(db) }); refreshAdminList(); }}

  // --- 国旗 ---
  let flagCtx, fCur="#fff", fDraw=false;
  function initFlagEditor() {
    const c = document.getElementById('flagCanvas'); flagCtx = c.getContext('2d');
    if(myData.flag) { const i=new Image(); i.onload=()=>flagCtx.drawImage(i,0,0); i.src=myData.flag; } else { flagCtx.fillStyle="#fff"; flagCtx.fillRect(0,0,100,60); }
    const pal = document.getElementById('paletteBox'); pal.innerHTML="";
    ['#000','#fff','#f00','#0f0','#00f','#ff0','#0ff','#f0f'].forEach(col => { const d = document.createElement('div'); d.className='color-dot'; d.style.background=col; d.onclick=()=>fCur=col; pal.appendChild(d); });
    c.onmousedown=e=>{ fDraw=true; drawF(e); }; c.onmousemove=e=>{ if(fDraw) drawF(e); }; c.onmouseup=()=>fDraw=false;
  }
  function drawF(e) { const r=document.getElementById('flagCanvas').getBoundingClientRect(); flagCtx.fillStyle=fCur; flagCtx.fillRect(Math.floor((e.clientX-r.left)/10)*10, Math.floor((e.clientY-r.top)/10)*10, 10, 10); }
  function clearFlag() { flagCtx.fillStyle="#fff"; flagCtx.fillRect(0,0,100,60); }
  async function saveFlag() { myData.flag = document.getElementById('flagCanvas').toDataURL(); saveDBsafe(myData); alert("国旗保存"); }
</script></body> </html>
