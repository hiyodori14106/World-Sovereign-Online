<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>仮想国家用世界地図</title>
<style>
  body { margin: 0; }
  svg { width: 100vw; height: 100vh; }
  path { fill: #cce5ff; stroke: #333; stroke-width: 0.5; cursor: pointer; transition: fill 0.2s; }
  path:hover { fill: #6699ff; }
</style>
</head>
<body>

<svg id="map" viewBox="0 0 2000 1001">
  <!-- 国名非表示の国境パス例 -->
  <path id="AF" d="M..."></path>
  <path id="AL" d="M..."></path>
  <path id="DZ" d="M..."></path>
  <!-- 必要な国すべてを追加 -->
</svg>

<script>
// 仮想国家用クリックイベント
document.querySelectorAll('#map path').forEach(path => {
  path.addEventListener('click', () => {
    // 色を変えて仮想国家として選択可能
    path.style.fill = '#ff9999';
    console.log('クリックされた国:', path.id);
  });
});
</script>

</body>
</html>
