<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>インタラクティブ世界地図（デモ）</title>
<style>
  body { margin: 0; }
  svg { width: 100vw; height: 100vh; }
  path { fill: #cce5ff; stroke: #333; stroke-width: 0.5; cursor: pointer; transition: fill 0.2s; }
  path:hover { fill: #6699ff; }
</style>
</head>
<body>

<!-- テスト用矩形大陸 -->
<svg id="map" viewBox="0 0 200 100">
  <path d="M10,10 L60,10 L60,50 L10,50 Z"></path>
  <path d="M70,20 L120,20 L120,60 L70,60 Z"></path>
  <path d="M130,30 L180,30 L180,70 L130,70 Z"></path>
</svg>

<script>
const map = document.getElementById('map');

// 後で仮想国家機能を追加できるようにクリックイベントを空にしておく
map.querySelectorAll('path').forEach(path => {
  path.addEventListener('click', () => {
    // 仮想国家処理追加用
    console.log('矩形クリック', path);
  });
});

// --- 例: 国境入りSVGを後で読み込む関数 ---
function loadSVGWorldMap(svgContent) {
  map.innerHTML = svgContent;

  // 新しいパスにクリックイベントを追加
  map.querySelectorAll('path').forEach(path => {
    path.addEventListener('click', () => {
      // 仮想国家処理追加用
      console.log('国境SVGクリック', path);
    });
  });
}

// 例: 後で fetch などでSVGを読み込んで loadSVGWorldMap に渡せば置き換え可能
</script>

</body>
</html>
