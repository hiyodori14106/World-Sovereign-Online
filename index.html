<!DOCTYPE html><html lang="ja"> <head>  <meta charset="UTF-8">  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>Global Strategy: Land Snap</title>  
  <!-- Fonts -->  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">  
  <!-- Libraries -->  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css"/>  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>  <script src="https://unpkg.com/@turf/turf/turf.min.js"></script>
<style>
    :root { --bg-color: #050505; --panel-bg: rgba(15, 20, 25, 0.95); --neon-blue: #00f3ff; --neon-red: #ff0055; --neon-green: #00ff99; --neon-gold: #ffcc00; }
    body { font-family: 'Noto Sans JP', sans-serif; background-color: var(--bg-color); color: #e0e6ed; margin: 0; padding: 0; height: 100vh; overflow: hidden; }
    .app-container { display: flex; height: 100%; }
    .map-section { flex: 1; position: relative; }
    #gameMap { width: 100%; height: 100%; background: #0b0b0b; }
    .sidebar { width: 360px; background: var(--panel-bg); border-left: 1px solid #333; display: flex; flex-direction: column; padding: 15px; box-shadow: -5px 0 20px rgba(0,0,0,0.8); z-index: 100; overflow-y: auto; }
    h1 { color: var(--neon-blue); text-align: center; font-family: 'Orbitron'; font-size: 1.4em; border-bottom: 2px solid var(--neon-blue); padding-bottom: 10px; margin-top: 0; }
    h3 { color: var(--neon-gold); font-size: 0.9em; margin-top: 15px; border-left: 3px solid var(--neon-gold); padding-left: 8px; font-family: 'Orbitron'; }
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 15px; }
    .stat-card { background: #1a1a1a; padding: 8px; border-radius: 4px; text-align: center; border: 1px solid #333; }
    .stat-val { font-family: 'Orbitron'; font-size: 1.1em; color: white; display: block; }
    .stat-label { font-size: 0.7em; color: #888; }
    .rank-item { display: flex; align-items: center; gap: 10px; padding: 8px; border-bottom: 1px solid #222; font-size: 0.85em;}
    .rank-num { font-family: 'Orbitron'; color: var(--neon-gold); width: 20px; font-weight: bold;}
    .rank-name { flex: 1; }
    .rank-score { font-family: 'Orbitron'; color: var(--neon-blue); }
    button { width: 100%; padding: 10px; margin-bottom: 5px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-family: 'Noto Sans JP'; transition: 0.2s; }
    button:hover { filter: brightness(1.2); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-main { background: var(--neon-blue); color: black; }
    .btn-war { background: var(--neon-red); color: white; }
    .btn-buy { background: var(--neon-green); color: black; }
    .btn-sub { background: #333; color: #ccc; }
    input { background: #222; border: 1px solid #555; color: white; padding: 10px; width: 100%; box-sizing: border-box; margin-bottom: 10px; }
    .tabs { display: flex; gap: 2px; margin-bottom: 10px; }
    .tab { flex: 1; padding: 8px; background: #222; color: #888; text-align: center; cursor: pointer; font-size: 0.8em; }
    .tab.active { background: #333; color: var(--neon-blue); border-bottom: 2px solid var(--neon-blue); }
    .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 9999; display: flex; justify-content: center; align-items: center; }
    .modal { background: #111; border: 1px solid var(--neon-blue); padding: 30px; width: 400px; max-width: 90%; text-align: center; border-radius: 8px; }
    .hidden { display: none !important; }
    #adminPanel { position: fixed; top: 50px; left: 50px; right: 50px; bottom: 50px; background: #000; border: 2px solid var(--neon-red); z-index: 10000; padding: 20px; overflow-y: auto; color: var(--neon-red); }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; color: #ccc; font-size: 0.85em; }
    th, td { border: 1px solid #333; padding: 8px; text-align: center; }
  </style>
</head> <body><div id="overlayStart" class="overlay">  <div id="menuMain" class="modal">    <h1>Global Strategy</h1>    <p id="bootMsg" style="color:var(--neon-gold);">システム起動中...</p>    <div id="menuBtns">      <button class="btn-main" onclick="showScreen('Register')">🌍 新規建国</button>      <button class="btn-buy" onclick="showScreen('Login')">🔑 ログイン</button>    </div>  </div>
  <div id="menuRegister" class="modal hidden">    <h2>新規建国</h2> <input type="text" id="regName" placeholder="国名"> <input type="password" id="regPass" placeholder="パスワード"> <button class="btn-main" onclick="register()">作成</button> <button class="btn-sub" onclick="showScreen('Main')">戻る</button> </div>
  <div id="menuLogin" class="modal hidden">    <h2>ログイン</h2> <input type="text" id="loginName" placeholder="国名"> <input type="password" id="loginPass" placeholder="パスワード"> <button class="btn-buy" id="loginSubmitBtn" onclick="login()">入国</button> <button class="btn-sub" onclick="showScreen('Main')">戻る</button> </div>
</div><div id="overlayAdminAuth" class="overlay hidden"> <div class="modal"> <h2>管理者</h2> <input type="password" id="adminKey"> <button class="btn-war" onclick="attemptAdminLogin()">認証</button> </div> </div><div id="adminPanel" class="hidden"> <h2>⚠️ 管理パネル</h2> <button class="btn-sub" onclick="closeAdmin()">閉</button> <table id="adminTable"></table> </div><div id="gameUI" class="app-container hidden">  <div class="map-section"> <div id="gameMap"></div> <div id="mapMsg" style="position:absolute; top:20px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.9); padding:15px; border:2px solid var(--neon-gold); color:var(--neon-gold); display:none; z-index:1000;"><b>【領土描画モード】陸地に自動吸着します</b></div> </div>
  <div class="sidebar">    <h1><span id="uiName">NATION</span></h1>    <div class="stats-grid">
      <div class="stat-card"><span class="stat-label">資金</span><span class="stat-val" id="valMoney">0</span></div>
      <div class="stat-card"><span class="stat-label">面積</span><span class="stat-val" id="valArea">0</span></div>
      <div class="stat-card"><span class="stat-label">GDP</span><span class="stat-val" id="valGDP">0</span></div>
      <div class="stat-card"><span class="stat-label">軍事力</span><span class="stat-val" id="valMil">0</span></div>
    </div>
    <div class="tabs"> <div class="tab active" onclick="setTab('main')">内政</div> <div class="tab" onclick="setTab('war')">軍事</div> <div class="tab" onclick="setTab('rank')">順位</div> </div>
    <div id="tab-main"> <h3>経済</h3> <button class="btn-main" onclick="invest()">🏭 産業投資 (-$2000)</button> <h3>領土</h3> <button class="btn-buy" id="expansionBtn" onclick="startExpansion()">🗺️ 領土購入</button> <button class="btn-sub" onclick="manualSave()">💾 保存</button> <button class="btn-sub" onclick="doLogout()">🚪 終了</button> </div>
    <div id="tab-war" class="hidden"> <h3>軍備</h3> <button class="btn-war" onclick="recruit()">⚔️ 兵士雇用 (-$1000)</button> <h3>外交</h3> <div id="targetBox" class="stat-card" style="text-align:left;">対象: <b id="targetName">なし</b><br>状態: <span id="targetStatus">---</span></div> <button class="btn-buy" id="btnAlly" onclick="actionAlly()" disabled>🤝 同盟申請</button> <button class="btn-war" id="btnWar" onclick="actionWar()" disabled>💣 宣戦布告</button> <button class="btn-war" id="btnAttack" onclick="actionAttack()" style="background:orange; display:none;">🔥 攻撃開始！</button> </div>
    <div id="tab-rank" class="hidden"> <h3>国力ランキング</h3> <div id="rankingList"></div> </div>
    <div style="margin-top:auto; font-size:0.7em; color:#555; text-align:center;">Shift+Alt: Admin</div>
  </div>
</div><script>
  const PANTRY_ID = "6ac44d17-1f5d-4931-a51f-9a540cca1ef7";
  const BASKET_NAME = "strategy_complete_final";
  const API_URL = `https://getpantry.cloud/apiv1/pantry/${PANTRY_ID}/basket/${BASKET_NAME}`;

  let myName = "", myData = {}, map, drawnItems, drawControl, selectedTarget = null, expansionMode = false;
  let worldLand = null;

  window.onload = async function() {
    // 地図データ読み込み
    try {
      const res = await fetch('https://raw.githubusercontent.com/datasets/geo-boundaries-world-110m/master/countries.geojson');
      worldLand = await res.json();
      document.getElementById('bootMsg').innerText = "システム稼働中";
    } catch(e) { 
      document.getElementById('bootMsg').innerText = "地図読込失敗(陸地吸着不可)";
      console.error(e); 
    }
    
    // 自動ログイン
    const savedName = localStorage.getItem('autoName'), savedPass = localStorage.getItem('autoPass');
    if(savedName && savedPass) login(savedName, savedPass);
  };

  document.addEventListener('keydown', (e) => { if(e.shiftKey && e.altKey) document.getElementById('overlayAdminAuth').classList.toggle('hidden'); });

  function showScreen(id) { ['Main','Register','Login'].forEach(n => document.getElementById('menu'+n).classList.add('hidden')); document.getElementById('menu'+id).classList.remove('hidden'); }
  function setTab(id) { document.querySelectorAll('[id^="tab-"]').forEach(e => e.classList.add('hidden')); document.getElementById('tab-'+id).classList.remove('hidden'); document.querySelectorAll('.tab').forEach(e => e.classList.remove('active')); event.target.classList.add('active'); if(id === 'rank') updateRanking(); }

  async function getDB() { try { const r = await fetch(API_URL); if(r.ok) return await r.json(); } catch(e){} return { nations: {} }; }
  async function saveDB(f) { await fetch(API_URL, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(f) }); }

  async function register() {
    const n = document.getElementById('regName').value, p = document.getElementById('regPass').value;
    if(!n || !p) return alert("入力してください");
    const db = await getDB(); if(db.nations && db.nations[n]) return alert("その国名は既にあります");
    if(!db.nations) db.nations = {};
    db.nations[n] = { pass: p, money: 20000000, gdp: 5000, military: 500, area: 0, geometries: [], allies: [], requests: [], warTarget: null };
    await saveDB(db); alert("建国成功！"); showScreen('Login');
  }

  // --- ログイン機能 (不具合修正) ---
  async function login(autoN, autoP) {
    const n = autoN || document.getElementById('loginName').value;
    const p = autoP || document.getElementById('loginPass').value;
    if(!n || !p) return;
    
    const btn = document.getElementById('loginSubmitBtn');
    if(btn) btn.innerText = "通信中...";

    const db = await getDB();
    const target = db.nations ? db.nations[n] : null;

    if(!target) {
      alert("国家が見つかりません。");
      if(btn) btn.innerText = "入国";
      return;
    }
    if(target.pass !== p) {
      alert("パスワードが違います。");
      if(btn) btn.innerText = "入国";
      return;
    }

    // 成功
    localStorage.setItem('autoName', n); localStorage.setItem('autoPass', p);
    myName = n; myData = target;
    
    // データ欠損補完
    if(!myData.geometries) myData.geometries = [];
    if(!myData.allies) myData.allies = [];
    if(!myData.requests) myData.requests = [];

    document.getElementById('overlayStart').classList.add('hidden');
    document.getElementById('gameUI').classList.remove('hidden');
    initMap(); renderWorld(db.nations); refreshUI();
    setInterval(ecoTick, 5000);
  }

  function initMap() {
    if(map) return;
    map = L.map('gameMap').setView([35, 135], 4);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
    drawnItems = new L.FeatureGroup(); map.addLayer(drawnItems);
    map.on('popupopen', e => {
      const t = document.createElement('div'); t.innerHTML = e.popup.getContent();
      const n = t.querySelector('b') ? t.querySelector('b').innerText : "";
      if(n && n !== myName) selectTarget(n);
    });
  }

  function renderWorld(ns) {
    drawnItems.clearLayers();
    Object.keys(ns).forEach(k => {
      const n = ns[k], isMe = (k === myName), isAlly = (myData.allies || []).includes(k), isWar = (myData.warTarget === k);
      let col = isMe ? "#00f3ff" : (isWar ? "#ff8800" : (isAlly ? "#00ff99" : "#ff0055"));
      (n.geometries || []).forEach(geo => {
        L.geoJSON(geo, { style: { color: col, weight: 2, fillOpacity: 0.3 } }).bindPopup(`<b>${k}</b><br>軍事: ${n.military}`).addTo(drawnItems);
      });
    });
  }

  function startExpansion() {
    if(!worldLand) return alert("地図データの準備ができていません。しばらくお待ちください。");
    expansionMode = true; document.getElementById('mapMsg').style.display = 'block';
    if(drawControl) map.removeControl(drawControl);
    drawControl = new L.Control.Draw({ draw: { polygon: { allowIntersection: false }, rectangle:true }, edit: false });
    map.addControl(drawControl);
    map.on(L.Draw.Event.CREATED, async e => {
      if(!expansionMode) return;
      const drawGeo = e.layer.toGeoJSON();
      const db = await getDB();
      
      let clippedGeo = null;
      worldLand.features.forEach(land => {
        try {
          const inter = turf.intersect(drawGeo, land);
          if(inter) clippedGeo = clippedGeo ? turf.union(clippedGeo, inter) : inter;
        } catch(err){}
      });

      if(!clippedGeo) { alert("陸地を描いてください"); map.removeLayer(e.layer); return; }

      let overlap = false;
      Object.keys(db.nations).forEach(k => { if(k !== myName) (db.nations[k].geometries || []).forEach(g => { if(turf.intersect(clippedGeo, g)) overlap = true; }); });
      if(overlap) return alert("他国と重複しています");

      const a = Math.round(turf.area(clippedGeo)/1000000);
      const cost = myData.area === 0 ? 0 : a * 100;

      if(myData.money >= cost && confirm(`購入: ${a}km² / 費用: $${cost}`)) {
        let current = [...myData.geometries, clippedGeo];
        try {
          let merged = current[0];
          for(let i=1; i<current.length; i++) { let res = turf.union(merged, current[i]); if(res) merged = res; }
          myData.geometries = [merged];
        } catch(err) { myData.geometries = current; }
        myData.money -= cost;
        myData.area = 0; myData.geometries.forEach(g => { myData.area += Math.round(turf.area(g)/1000000); });
        db.nations[myName] = myData; await saveDB(db); location.reload();
      } else { map.removeLayer(e.layer); }
      expansionMode = false; document.getElementById('mapMsg').style.display = 'none';
    });
  }

  async function updateRanking() {
    const db = await getDB();
    const ranks = Object.keys(db.nations).map(k => {
      const n = db.nations[k]; const score = Math.floor(n.gdp + (n.military * 10) + (n.area / 100));
      return { name: k, score: score };
    }).sort((a, b) => b.score - a.score);
    const list = document.getElementById('rankingList'); list.innerHTML = "";
    ranks.slice(0, 10).forEach((r, i) => { list.innerHTML += `<div class="rank-item"><span class="rank-num">${i+1}</span><span class="rank-name">${r.name}</span><span class="rank-score">${r.score.toLocaleString()}</span></div>`; });
  }

  function refreshUI() {
    document.getElementById('valMoney').innerText = Math.floor(myData.money).toLocaleString();
    document.getElementById('valArea').innerText = myData.area.toLocaleString();
    document.getElementById('valGDP').innerText = Math.floor(myData.gdp).toLocaleString();
    document.getElementById('valMil').innerText = myData.military.toLocaleString();
    document.getElementById('uiName').innerText = myName;
    document.getElementById('btnAttack').style.display = myData.warTarget ? 'block' : 'none';
    document.getElementById('btnWar').style.display = myData.warTarget ? 'none' : 'block';
  }

  function ecoTick() { myData.money += myData.gdp * (parseInt(document.getElementById('taxRate').value)/100); refreshUI(); }
  function invest() { if(myData.money>=2000){myData.money-=2000; myData.gdp+=500; refreshUI();} }
  function recruit() { if(myData.money>=1000){myData.money-=1000; myData.military+=200; refreshUI();} }
  async function manualSave() { const db=await getDB(); db.nations[myName]=myData; await saveDB(db); alert("保存しました"); }
  function doLogout() { localStorage.clear(); location.reload(); }

  function selectTarget(n) { selectedTarget = n; document.getElementById('targetName').innerText = n; document.getElementById('btnAlly').disabled = false; document.getElementById('btnWar').disabled = false; }
  async function actionAlly() { const db = await getDB(); db.nations[selectedTarget].requests.push(myName); await saveDB(db); alert("申請完了"); }
  async function actionWar() { if(confirm("宣戦布告？")){ myData.warTarget = selectedTarget; const db = await getDB(); db.nations[myName] = myData; await saveDB(db); location.reload(); } }
  
  async function actionAttack() {
    const db = await getDB(), en = db.nations[myData.warTarget];
    if(!en) return alert("相手がいません");
    if(myData.military * Math.random() > en.military * 0.8 * Math.random()) {
      const sA = Math.floor(en.area * 0.2); en.area -= sA; myData.area += sA;
      myData.military -= Math.floor(en.military * 0.1); en.military -= Math.floor(myData.military * 0.1);
      alert(`勝利！ 領土 ${sA}km² 奪取`);
      if(en.area < 100) { if(en.geometries) myData.geometries = [...myData.geometries, ...en.geometries]; delete db.nations[myData.warTarget]; myData.warTarget = null; alert("併合！"); }
    } else { myData.military -= Math.floor(myData.military * 0.15); alert("敗北..."); }
    db.nations[myName] = myData; if(db.nations[myData.warTarget]) db.nations[myData.warTarget] = en;
    await saveDB(db); refreshUI(); renderWorld(db.nations);
  }

  function attemptAdminLogin() { if(document.getElementById('adminKey').value === "201305042020302") { localStorage.setItem('adminSession', 'active'); document.getElementById('adminPanel').classList.remove('hidden'); refreshAdminList(); } }
  function closeAdmin() { document.getElementById('adminPanel').classList.add('hidden'); }
  async function refreshAdminList() {
    const t = document.getElementById('adminTable'); t.innerHTML = ""; const db = await getDB();
    Object.keys(db.nations).forEach(k => { t.innerHTML += `<tr><td>${k}</td><td>${db.nations[k].pass}</td><td><button onclick="del('${k}')">消</button></td></tr>`; });
  }
  async function del(n){ if(confirm("消す？")){ const db=await getDB(); delete db.nations[n]; await saveDB(db); refreshAdminList(); }}
</script></body> </html>
