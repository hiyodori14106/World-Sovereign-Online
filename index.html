<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Infinite Canvas Ultimate</title>
    <script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
    <style>
        :root { --primary: #007AFF; --bg: #ffffff; --ui-bg: rgba(255, 255, 255, 0.85); --text: #333; --shadow: 0 8px 32px rgba(0,0,0,0.1); }
        body { margin: 0; overflow: hidden; background: var(--bg); font-family: -apple-system, sans-serif; color: var(--text); touch-action: none; }
        canvas { display: block; cursor: crosshair; }

        /* UI Layer */
        #ui-layer { position: fixed; top: 10px; left: 10px; width: 280px; pointer-events: none; z-index: 100; display: flex; flex-direction: column; gap: 10px; }
        .glass { background: var(--ui-bg); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.4); border-radius: 20px; box-shadow: var(--shadow); pointer-events: auto; padding: 15px; }
        
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        h2 { margin: 0; font-size: 16px; font-weight: 700; }
        .status-tag { font-size: 9px; font-weight: bold; padding: 4px 10px; border-radius: 20px; background: rgba(0,0,0,0.05); display: flex; align-items: center; gap: 4px; }
        .dot { width: 6px; height: 6px; border-radius: 50%; background: #ccc; }
        .dot.online { background: #34C759; box-shadow: 0 0 8px #34C759; }

        label { display: block; font-size: 9px; font-weight: 700; color: #999; margin-bottom: 4px; text-transform: uppercase; }
        input, select, button { width: 100%; border: none; background: rgba(0,0,0,0.05); padding: 8px; border-radius: 10px; font-size: 13px; outline: none; box-sizing: border-box; }

        /* Palette */
        .brush-section { display: flex; align-items: center; gap: 10px; margin: 5px 0; }
        #colorPreview { width: 44px; height: 44px; border-radius: 12px; border: 2px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); position: relative; overflow: hidden; flex-shrink: 0; }
        #colorPicker { position: absolute; top: -5px; left: -5px; width: 60px; height: 60px; cursor: pointer; opacity: 0; }
        .palette { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; flex-grow: 1; }
        .swatch { aspect-ratio: 1; border-radius: 5px; cursor: pointer; border: 1.5px solid transparent; }
        .swatch.active { border-color: var(--primary); transform: scale(1.1); }

        /* Admin Box */
        .admin-box { border: 2px solid #ff3b30; background: rgba(255, 235, 235, 0.9); display: block; margin-top: 10px; }
        .admin-btn { background: #007AFF; color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 8px; font-weight: bold; }
        .danger-btn { background: #ff3b30; }

        /* Chat */
        #chat-container { position: fixed; bottom: 10px; left: 10px; width: 300px; max-height: 150px; overflow: hidden; padding: 0; }
        #messages { flex: 1; overflow-y: auto; padding: 10px; font-size: 11px; display: flex; flex-direction: column; gap: 4px; }
        .msg { background: rgba(0,0,0,0.03); padding: 5px 10px; border-radius: 8px; }
        #chat-input { background: transparent; border-top: 1px solid rgba(0,0,0,0.05); width: 100%; }

        .cursor-label { position: fixed; pointer-events: none; background: #000; color: #fff; padding: 2px 8px; border-radius: 10px; font-size: 10px; transform: translate(10px, 10px); }
        .guide { font-size: 9px; color: #999; margin-top: 10px; border-top: 1px solid rgba(0,0,0,0.05); padding-top: 8px; }
    </style>
</head>
<body>

<div id="ui-layer">
    <div class="glass">
        <div class="header-row">
            <h2 id="t-title">Infinite Canvas</h2>
            <div class="status-tag"><div id="status-dot" class="dot"></div><span id="t-status">...</span></div>
        </div>
        <div style="display:flex; gap:10px; margin-bottom:10px;">
            <div style="flex:1"><label id="t-label-lang">LANG</label><select id="langSelect"><option value="en">EN</option><option value="ja">JA</option></select></div>
            <div style="flex:2"><label id="t-label-name">NAME</label><input type="text" id="nameInput"></div>
        </div>
        <div>
            <label id="t-label-color">COLOR</label>
            <div class="brush-section">
                <div id="colorPreview"><input type="color" id="colorPicker" value="#007AFF"></div>
                <div id="palette" class="palette"></div>
            </div>
            <div id="admin-brush-ui" style="display:none; margin-top:5px;">
                <label>BRUSH SIZE: <span id="brushSizeVal">1</span></label>
                <input type="range" id="brushSizeInput" min="1" max="20" value="1">
            </div>
        </div>
        <div id="t-guide" class="guide"></div>
    </div>
    <div id="admin-mount"></div>
</div>

<div id="chat-container" class="glass"><div id="messages"></div><input type="text" id="chat-input"></div>
<canvas id="gameCanvas"></canvas>

<script>
// --- 多言語設定 ---
const i18n = {
    en: { title: "Infinite Canvas", status: "Wait", live: "Live", name: "Name", color: "Color", lang: "Lang", chat: "Chat...", guide: "• <b>Left/1 Finger</b>: Paint<br>• <b>Right/2 Fingers</b>: Move" },
    ja: { title: "無限キャンバス", status: "待機中", live: "ライブ", name: "名前", color: "色", lang: "言語", chat: "チャット...", guide: "• <b>左クリック/1本指</b>: 描く<br>• <b>右クリック/2本指</b>: 移動" }
};
function setLanguage(lang) {
    const t = i18n[lang] || i18n.en;
    document.getElementById('t-title').innerText = t.title;
    document.getElementById('t-label-name').innerText = t.name;
    document.getElementById('t-label-color').innerText = t.color;
    document.getElementById('t-label-lang').innerText = t.lang;
    document.getElementById('chat-input').placeholder = t.chat;
    document.getElementById('t-guide').innerHTML = t.guide;
    if (document.getElementById('status-dot').classList.contains('online')) document.getElementById('t-status').innerText = t.live;
}

// --- 管理者(2020302) ---
const ADMIN_HASH = "3884b294060851f5c643b9e4073e51d951522f986427382d56d7827827e8a93a";
async function sha256(m){const b=new TextEncoder().encode(m);const h=await crypto.subtle.digest('SHA-256',b);return Array.from(new Uint8Array(h)).map(x=>x.toString(16).padStart(2,'0')).join('');}

// キーイベント判定の修正 (Shift+Ctrl+Alt+A)
window.addEventListener('keydown', async (e) => {
    if (e.shiftKey && e.ctrlKey && e.altKey && (e.key === 'a' || e.key === 'A' || e.keyCode === 65)) {
        const p = prompt("Enter Admin Password:");
        if (!p) return;
        const hashed = await sha256(p);
        if (hashed === ADMIN_HASH) {
            activateAdmin();
            alert("Admin Mode: Access Granted.");
        } else {
            alert("Access Denied.");
        }
    }
});

let pendingImage = null; 

function activateAdmin() {
    isAdmin = true;
    document.getElementById('admin-brush-ui').style.display = 'block';
    document.getElementById('admin-mount').innerHTML = `
        <div class="glass admin-box">
            <h2 style="color:#d00;">GOD MODE</h2>
            <label>IMPORT IMAGE</label><input type="file" id="imageInput" accept="image/*">
            <label style="margin-top:5px;">SIZE (px)</label><input type="number" id="imgSize" value="50">
            <button class="admin-btn" onclick="saveToPantry()">FORCE SAVE</button>
            <button class="admin-btn danger-btn" onclick="clearCanvas()">CLEAR WORLD</button>
        </div>`;
    setupAdminEvents();
}

// --- 通信・ロジック ---
const PANTRY_ID = "1236839c-7644-4b65-881d-e65dc707e34e"; 
const PANTRY_URL = `https://getpantry.cloud/apiv1/pantry/${PANTRY_ID}/basket/world_data_v2`;
const gun = Gun(['https://gun-manhattan.herokuapp.com/gun']);
const db = gun.get('infinite_canvas_ultimate_v6'); // データ競合を避けるためバージョン上げ
const dotsDB = db.get('dots'), cursorDB = db.get('cursors'), chatDB = db.get('chat');

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let camX = 0, camY = 0, zoom = 15, myId = Math.random().toString(36).slice(2), myName = "Anon";
let localDots = {}, isPainting = false, isDragging = false, lastP, brushSize = 1, isAdmin = false;
let hoverPos = null;

const toScreen = (wx, wy) => ({ x: (wx - camX) * zoom + canvas.width / 2, y: (wy - camY) * zoom + canvas.height / 2 });
const toWorld = (sx, sy) => ({ wx: Math.floor((sx - canvas.width / 2) / zoom + camX), wy: Math.floor((sy - canvas.height / 2) / zoom + camY) });
dotsDB.map().on((color, key) => { if (color) localDots[key] = color; else delete localDots[key]; });

function render() {
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    ctx.fillStyle = '#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);

    for(let k in localDots){
        const [x,y]=k.split(',').map(Number); const s=toScreen(x,y);
        if(s.x>-zoom&&s.x<canvas.width&&s.y>-zoom&&s.y<canvas.height){ ctx.fillStyle=localDots[k]; ctx.fillRect(s.x,s.y,zoom+0.5,zoom+0.5); }
    }

    // ガイド描画
    if (hoverPos) {
        ctx.fillStyle = "rgba(200, 200, 200, 0.5)";
        if (pendingImage) {
            const s = toScreen(hoverPos.wx, hoverPos.wy);
            ctx.fillRect(s.x, s.y, pendingImage.w * zoom, pendingImage.h * zoom);
        } else {
            const r = Math.floor((brushSize - 1) / 2);
            const s = toScreen(hoverPos.wx - r, hoverPos.wy - r);
            ctx.fillRect(s.x, s.y, brushSize * zoom, brushSize * zoom);
        }
    }
    requestAnimationFrame(render);
}

function paint(x, y) {
    if (pendingImage) {
        const s = toWorld(x, y);
        pendingImage.data.forEach(p => dotsDB.get(`${s.wx + p.x},${s.wy + p.y}`).put(p.hex));
        pendingImage = null;
        return;
    }
    const pos = toWorld(x, y); const color = document.getElementById('colorPicker').value;
    const r = Math.floor((brushSize - 1) / 2);
    for(let dx = -r; dx <= r; dx++) for(let dy = -r; dy <= r; dy++) {
        const k = `${pos.wx+dx},${pos.wy+dy}`; if (localDots[k]!==color) dotsDB.get(k).put(color);
    }
}

canvas.onmousedown = (e) => {
    if (e.button === 0) { isPainting = true; paint(e.clientX, e.clientY); }
    else { isDragging = true; lastP = {x: e.clientX, y: e.clientY}; }
};
window.onmousemove = (e) => {
    hoverPos = toWorld(e.clientX, e.clientY);
    if (isPainting) paint(e.clientX, e.clientY);
    if (isDragging) { camX -= (e.clientX - lastP.x)/zoom; camY -= (e.clientY - lastP.y)/zoom; lastP = {x: e.clientX, y: e.clientY}; }
    cursorDB.get(myId).put({ x: hoverPos.wx, y: hoverPos.wy, name: myName, time: Date.now() });
};
window.onmouseup = () => isPainting = isDragging = false;
window.onwheel = (e) => zoom = Math.min(Math.max(zoom * (e.deltaY > 0 ? 0.85 : 1.15), 1), 80);
canvas.oncontextmenu = e => e.preventDefault();

canvas.addEventListener('touchstart', e => {
    e.preventDefault(); const t = e.touches[0]; hoverPos = toWorld(t.clientX, t.clientY);
    if (e.touches.length === 1) { isPainting = true; paint(t.clientX, t.clientY); }
    else { isDragging = true; lastP = {x: (e.touches[0].pageX + e.touches[1].pageX)/2, y: (e.touches[0].pageY + e.touches[1].pageY)/2}; }
}, {passive:false});

function setupAdminEvents() {
    document.getElementById('imageInput').onchange = (e) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
            const img = new Image();
            img.onload = () => {
                const size = parseInt(document.getElementById('imgSize').value);
                const tempC = document.createElement('canvas'); const tCtx = tempC.getContext('2d');
                tempC.width = size; tempC.height = Math.floor(size * (img.height / img.width));
                tCtx.drawImage(img, 0, 0, tempC.width, tempC.height);
                const d = tCtx.getImageData(0, 0, tempC.width, tempC.height).data;
                const pixels = [];
                for(let y=0; y<tempC.height; y++) for(let x=0; x<tempC.width; x++) {
                    const i = (y * tempC.width + x) * 4;
                    if(d[i+3] > 128) pixels.push({x, y, hex: "#" + ((1 << 24) + (d[i] << 16) + (d[i+1] << 8) + d[i+2]).toString(16).slice(1)});
                }
                pendingImage = { data: pixels, w: tempC.width, h: tempC.height };
            }; img.src = ev.target.result;
        }; reader.readAsDataURL(e.target.files[0]);
    };
    document.getElementById('brushSizeInput').oninput = (e) => { brushSize = e.target.value; document.getElementById('brushSizeVal').innerText = brushSize; };
}

const colors = ["#000000", "#FFFFFF", "#FF3B30", "#FF9500", "#FFCC00", "#4CD964", "#5AC8FA", "#007AFF", "#5856D6", "#AF52DE", "#FF2D55", "#8E8E93"];
colors.forEach(c => {
    const s = document.createElement('div'); s.className = 'swatch'; s.style.backgroundColor = c;
    s.onclick = () => { document.getElementById('colorPicker').value = c; document.getElementById('colorPreview').style.backgroundColor = c; };
    document.getElementById('palette').appendChild(s);
});
document.getElementById('nameInput').oninput = (e) => myName = e.target.value || "Anon";
chatDB.map().on((data) => {
    if (!data) return;
    const m = document.getElementById('messages'); const d = document.createElement('div');
    d.className = 'msg'; d.innerHTML = `<b>${data.user}</b>${data.text}`;
    m.appendChild(d); m.scrollTop = m.scrollHeight; if(m.childNodes.length > 20) m.removeChild(m.firstChild);
});
document.getElementById('chat-input').onkeypress = (e) => {
    if (e.key === 'Enter' && e.target.value.trim() !== "") {
        chatDB.get(Date.now()).put({ user: myName, text: e.target.value }); e.target.value = "";
    }
};

const otherCursors = {};
cursorDB.map().on((data, id) => {
    if (id === myId || !data) return;
    if (!otherCursors[id]) {
        const el = document.createElement('div'); el.className = 'cursor-label';
        document.body.appendChild(el); otherCursors[id] = el;
    }
    const s = toScreen(data.x, data.y);
    otherCursors[id].style.left = s.x + 'px'; otherCursors[id].style.top = s.y + 'px';
    otherCursors[id].innerText = data.name;
    otherCursors[id].style.opacity = (Date.now() - data.time > 5000) ? 0 : 1;
});

async function saveToPantry() { try{ await fetch(PANTRY_URL, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(localDots) }); }catch(e){} }
async function loadFromPantry() {
    const res = await fetch(PANTRY_URL);
    if (res.ok) {
        const data = await res.json(); for (let key in data) dotsDB.get(key).put(data[key]);
        document.getElementById('status-dot').classList.add("online");
        setLanguage(document.getElementById('langSelect').value);
    }
}
function clearCanvas() { if(confirm("WIPE?")) dotsDB.put(null); }
setInterval(() => { if(Object.keys(localDots).length > 0) saveToPantry(); }, 30000);
loadFromPantry();

const userL = navigator.language.split('-')[0];
document.getElementById('langSelect').value = i18n[userL] ? userL : 'en';
setLanguage(document.getElementById('langSelect').value);
render();
</script>
</body>
</html>
