<!DOCTYPE html><html lang="ja"> <head>  <meta charset="UTF-8">  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>Global Strategy: Evolution</title>  
  <!-- Fonts -->  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">  
  <!-- Libraries -->  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css"/>  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>  <script src="https://unpkg.com/@turf/turf/turf.min.js"></script>
<style>
    :root { --bg-color: #050505; --panel-bg: rgba(15, 20, 25, 0.95); --neon-blue: #00f3ff; --neon-red: #ff0055; --neon-green: #00ff99; --neon-gold: #ffcc00; }
    body { font-family: 'Noto Sans JP', sans-serif; background-color: var(--bg-color); color: #e0e6ed; margin: 0; padding: 0; height: 100vh; overflow: hidden; }
    .app-container { display: flex; height: 100%; }
    .map-section { flex: 1; position: relative; }
    #gameMap { width: 100%; height: 100%; background: #0b0b0b; }
    .sidebar { width: 380px; background: var(--panel-bg); border-left: 1px solid #333; display: flex; flex-direction: column; padding: 15px; box-shadow: -5px 0 20px rgba(0,0,0,0.8); z-index: 100; overflow-y: auto; }
    h1 { color: var(--neon-blue); text-align: center; font-family: 'Orbitron'; font-size: 1.2em; border-bottom: 2px solid var(--neon-blue); padding-bottom: 10px; margin-top: 0; }
    h3 { color: var(--neon-gold); font-size: 0.8em; margin-top: 15px; border-left: 3px solid var(--neon-gold); padding-left: 8px; font-family: 'Orbitron'; }
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-bottom: 10px; }
    .stat-card { background: #111; padding: 5px; border-radius: 4px; text-align: center; border: 1px solid #333; }
    .stat-val { font-family: 'Orbitron'; font-size: 0.9em; color: white; display: block; }
    .stat-label { font-size: 0.6em; color: #888; }
    button { width: 100%; padding: 8px; margin-bottom: 4px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-family: 'Noto Sans JP'; transition: 0.2s; font-size: 0.8em;}
    button:hover { filter: brightness(1.2); }
    .btn-main { background: var(--neon-blue); color: black; }
    .btn-war { background: var(--neon-red); color: white; }
    .btn-buy { background: var(--neon-green); color: black; }
    .btn-sub { background: #333; color: #ccc; }
    input, select { background: #222; border: 1px solid #555; color: white; padding: 8px; width: 100%; box-sizing: border-box; margin-bottom: 8px; font-size: 0.8em; }
    .tabs { display: flex; gap: 1px; margin-bottom: 10px; flex-wrap: wrap; }
    .tab { flex: 1; min-width: 60px; padding: 6px; background: #222; color: #888; text-align: center; cursor: pointer; font-size: 0.65em; }
    .tab.active { background: #333; color: var(--neon-blue); border-bottom: 2px solid var(--neon-blue); }
    /* Chat & Market */
    #chatBox { height: 120px; background: #000; border: 1px solid #333; overflow-y: auto; padding: 5px; font-size: 0.7em; margin-bottom: 5px; color: #ccc; }
    .market-item { background: #1a1a1a; padding: 5px; margin-bottom: 3px; border: 1px solid #444; font-size: 0.7em; display: flex; justify-content: space-between; align-items: center; }
    .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 9999; display: flex; justify-content: center; align-items: center; }
    .modal { background: #111; border: 1px solid var(--neon-blue); padding: 30px; width: 400px; max-width: 90%; text-align: center; border-radius: 8px; }
    .hidden { display: none !important; }
    #adminPanel { position: fixed; top: 2%; left: 2%; width: 96%; height: 96%; background: #000; border: 2px solid var(--neon-red); z-index: 10000; padding: 15px; overflow-y: auto; color: var(--neon-red); box-sizing: border-box; }
    table { width: 100%; border-collapse: collapse; font-size: 0.75em; color: #ccc; }
    th, td { border: 1px solid #333; padding: 4px; text-align: center; }
  </style>
</head> <body><div id="overlayStart" class="overlay">  <div id="menuMain" class="modal">    <h1>Global Strategy</h1>    <p style="color:#aaa; font-size:0.8em;">リソース・貿易・技術・戦争</p>    <div id="loadingMsg" style="color:var(--neon-green); margin-bottom:10px; display:none;">ログイン中...</div>    <button class="btn-main" onclick="showScreen('Register')">🌍 新規建国</button>    <button class="btn-buy" onclick="showScreen('Login')">🔑 ログイン</button>  </div>
  <div id="menuRegister" class="modal hidden">    <h2>新規建国</h2> <input type="text" id="regName" placeholder="国名"> <input type="password" id="regPass" placeholder="パスワード"> <button class="btn-main" onclick="register()">開始</button> <button class="btn-sub" onclick="showScreen('Main')">戻る</button> </div>
  <div id="menuLogin" class="modal hidden">    <h2>ログイン</h2> <input type="text" id="loginName" placeholder="国名"> <input type="password" id="loginPass" placeholder="パスワード"> <button class="btn-buy" onclick="login()">入国</button> <button class="btn-sub" onclick="showScreen('Main')">戻る</button> </div>
</div><div id="overlayAdminAuth" class="overlay hidden"> <div class="modal"> <h2 style="color:red;">ADMIN</h2> <input type="password" id="adminKey"> <button class="btn-war" onclick="attemptAdminLogin()">UNLOCK</button> </div> </div><div id="adminPanel" class="hidden"> <h2>⚠️ MASTER CONSOLE</h2> <button class="btn-sub" onclick="document.getElementById('adminPanel').classList.add('hidden')">CLOSE</button> <table id="adminTable"></table> </div><div id="gameUI" class="app-container hidden">  <div class="map-section"> <div id="gameMap"></div> <div id="mapMsg" style="position:absolute; top:20px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.9); padding:10px; border:2px solid var(--neon-gold); color:var(--neon-gold); display:none; z-index:1000;"><b>領土描画中...</b></div> </div>
  <div class="sidebar">    <h1><span id="uiName">NATION</span></h1>    
    <div class="stats-grid">
      <div class="stat-card"><span class="stat-label">資金</span><span class="stat-val" id="valMoney">0</span></div>
      <div class="stat-card"><span class="stat-label">面積</span><span class="stat-val" id="valArea">0</span></div>
      <div class="stat-card"><span class="stat-label">鉄</span><span class="stat-val" id="valIron" style="color:var(--neon-gold);">0</span></div>
      <div class="stat-card"><span class="stat-label">石油</span><span class="stat-val" id="valOil" style="color:var(--neon-red);">0</span></div>
    </div>
    <div class="tabs"> 
      <div class="tab active" onclick="setTab('main')">内政</div> 
      <div class="tab" onclick="setTab('war')">軍事・外交</div> 
      <div class="tab" onclick="setTab('tech')">技術</div> 
      <div class="tab" onclick="setTab('trade')">貿易</div> 
      <div class="tab" onclick="setTab('rank')">順位</div>
      <div class="tab" onclick="setTab('flag')">国旗</div>
    </div>
    <!-- Tabs Content -->
    <div id="tab-main"> 
      <h3>経済・領土</h3> <button class="btn-main" onclick="invest()">🏭 産業投資 (-$2000)</button> 
      <div style="margin:5px 0; font-size:0.7em;">所得税: <span id="taxVal">10</span>% <input type="range" id="taxRate" min="0" max="50" value="10" onchange="document.getElementById('taxVal').innerText=this.value"></div>
      <button class="btn-buy" onclick="startExpansion()">🗺️ 領土購入</button> <button class="btn-sub" onclick="manualSave()">💾 保存</button> <button class="btn-sub" onclick="doLogout()">🚪 終了</button> 
    </div>
    <div id="tab-war" class="hidden"> 
      <h3>軍事</h3> <button class="btn-war" onclick="recruit()">⚔️ 兵士雇用 (-$1000)</button> 
      <h3>世界チャット</h3> <div id="chatBox"></div> <input type="text" id="chatInput" placeholder="メッセージ..." style="margin-bottom:2px;"> <button class="btn-main" onclick="sendChat()" style="padding:4px;">送信</button>
      <h3>外交</h3> <div class="stat-card" style="text-align:left;">対象: <b id="targetName">なし</b><br>状態: <span id="targetStatus">---</span></div>
      <button class="btn-buy" id="btnAlly" onclick="actionAlly()" disabled>🤝 同盟申請</button> <button class="btn-war" id="btnWar" onclick="actionWar()" disabled>💣 宣戦布告</button> 
    </div>
    <div id="tab-tech" class="hidden">
      <h3>技術ツリー</h3>
      <div class="stat-card">軍事技術 Lv.<span id="techMil">1</span><button onclick="upgradeTech('mil')">研究 (-$10万)</button></div>
      <div class="stat-card">経済技術 Lv.<span id="techEco">1</span><button onclick="upgradeTech('eco')">研究 (-$10万)</button></div>
    </div>
    <div id="tab-trade" class="hidden">
      <h3>貿易マーケット</h3>
      <select id="tradeType"><option value="iron">鉄</option><option value="oil">石油</option></select>
      <input type="number" id="tradeAmt" placeholder="数量"> <input type="number" id="tradePrice" placeholder="価格($)">
      <button class="btn-buy" onclick="postTrade()">出品する</button>
      <div id="marketList"></div>
    </div>
    <div id="tab-rank" class="hidden"> <h3>世界国力ランキング</h3> <div id="rankingList"></div> </div>
    <div id="tab-flag" class="hidden"> <h3>国旗</h3> <canvas id="flagCanvas" width="100" height="60"></canvas> <div class="palette" id="paletteBox"></div> <button class="btn-main" onclick="saveFlag()">💾 保存</button> </div>
    <div style="margin-top:auto; font-size:0.6em; color:#444; text-align:center;">Shift+Alt: Admin</div>
  </div>
</div><script>
  const PANTRY_ID = "6ac44d17-1f5d-4931-a51f-9a540cca1ef7", BASKET_NAME = "strategy_complete_final_v2";
  const API_URL = `https://getpantry.cloud/apiv1/pantry/${PANTRY_ID}/basket/${BASKET_NAME}`;

  let myName = "", myData = {}, map, drawnItems, drawControl, selectedTarget = null, expansionMode = false;

  window.onload = () => { const sn=localStorage.getItem('autoName'), sp=localStorage.getItem('autoPass'); if(sn && sp) login(sn, sp); };
  document.addEventListener('keydown', e => { if(e.shiftKey && e.altKey) document.getElementById('overlayAdminAuth').classList.toggle('hidden'); });

  function showScreen(id) { ['Main','Register','Login'].forEach(n => document.getElementById('menu'+n).classList.add('hidden')); document.getElementById('menu'+id).classList.remove('hidden'); }
  function setTab(id) { document.querySelectorAll('[id^="tab-"]').forEach(e => e.classList.add('hidden')); document.getElementById('tab-'+id).classList.remove('hidden'); document.querySelectorAll('.tab').forEach(e => e.classList.remove('active')); event.target.classList.add('active'); if(id==='rank') updateRanking(); if(id==='flag') initFlagEditor(); if(id==='trade') refreshMarket(); }

  async function getDB() { try { const r = await fetch(API_URL); if(r.ok) return await r.json(); } catch(e){} return { nations: {}, chat: [], market: [] }; }
  async function saveDB(f) { await fetch(API_URL, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(f) }); }

  async function register() {
    const n=document.getElementById('regName').value, p=document.getElementById('regPass').value;
    const db=await getDB(); if(db.nations[n]) return alert("重複");
    db.nations[n] = { pass:p, money:20000000, gdp:5000, military:500, area:0, iron:100, oil:100, tech:{mil:1, eco:1}, geometries:[], allies:[], requests:[], warTarget:null };
    db.chat.push({sender:"SYSTEM", msg:`${n}が建国されました！`});
    await saveDB(db); showScreen('Login');
  }

  async function login(an, ap) {
    const n=an||document.getElementById('loginName').value, p=ap||document.getElementById('loginPass').value;
    const db=await getDB(); const target=db.nations[n];
    if(!target || target.pass !== p) return;
    localStorage.setItem('autoName',n); localStorage.setItem('autoPass',p);
    myName=n; myData=target;
    if(!myData.iron) myData.iron=0; if(!myData.oil) myData.oil=0; if(!myData.tech) myData.tech={mil:1, eco:1};
    document.getElementById('overlayStart').classList.add('hidden'); document.getElementById('gameUI').classList.remove('hidden');
    initMap(); renderWorld(db.nations); refreshUI(); setInterval(ecoTick, 5000);
  }

  function initMap() {
    if(map) return;
    map = L.map('gameMap').setView([35, 135], 3);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
    drawnItems = new L.FeatureGroup(); map.addLayer(drawnItems);
    map.on('popupopen', e => { const n=e.popup.getContent().match(/<b>(.*?)<\/b>/)[1]; if(n!==myName) selectTarget(n); });
  }

  function renderWorld(ns) {
    drawnItems.clearLayers();
    Object.keys(ns).forEach(k => {
      const n=ns[k], isMe=(k===myName), isWar=(myData.warTarget===k), isAlly=(myData.allies||[]).includes(k);
      let col = isMe?"#00f3ff":(isWar?"#ff8800":(isAlly?"#00ff99":"#ff0055"));
      (n.geometries||[]).forEach(g => { L.geoJSON(g, {style:{color:col, weight:1, fillOpacity:0.3}}).bindPopup(`<b>${k}</b><br>軍事:${n.military}`).addTo(drawnItems); });
    });
  }

  function startExpansion() {
    expansionMode=true; document.getElementById('mapMsg').style.display='block';
    if(drawControl) map.removeControl(drawControl);
    drawControl=new L.Control.Draw({draw:{polygon:{allowIntersection:false}, rectangle:true}, edit:false});
    map.addControl(drawControl);
    map.on(L.Draw.Event.CREATED, async e => {
      const newGeo=e.layer.toGeoJSON(); const db=await getDB();
      const a=Math.round(L.GeometryUtil.geodesicArea(e.layer.getLatLngs()[0])/1000000);
      const cost=(myData.area===0)?0:a*100;
      if(myData.money>=cost && confirm(`購入しますか？`)) {
        let cur=[...myData.geometries, newGeo];
        try { let m=cur[0]; for(let i=1; i<cur.length; i++){ let r=turf.union(m, cur[i]); if(r) m=r; } myData.geometries=[m]; } catch(e){ myData.geometries=cur; }
        myData.money-=cost; myData.area=0; myData.geometries.forEach(g=>myData.area+=Math.round(turf.area(g)/1000000));
        db.nations[myName]=myData; await saveDB(db); location.reload();
      }
    });
  }

  async function ecoTick() {
    // 資源生産 & 経済
    myData.iron += Math.floor(myData.area / 5000);
    myData.oil += Math.floor(myData.area / 10000);
    myData.money += (myData.gdp * (parseInt(document.getElementById('taxRate').value)/100)) * (myData.tech.eco * 0.5);
    
    const db = await getDB();
    if(myData.warTarget) await autoWar(db);
    
    // チャット更新
    const cb = document.getElementById('chatBox');
    cb.innerHTML = db.chat.slice(-20).map(c => `<div><b>${c.sender}:</b> ${c.msg}</div>`).join('');
    cb.scrollTop = cb.scrollHeight;

    db.nations[myName] = myData;
    await saveDB(db); refreshUI();
  }

  async function autoWar(db) {
    const enName=myData.warTarget, en=db.nations[enName]; if(!en) { myData.warTarget=null; return; }
    // 技術補正
    const myPow = myData.military * (0.5+Math.random()) * myData.tech.mil;
    const enPow = en.military * (0.5+Math.random()) * (en.tech?en.tech.mil:1);
    if(myPow > enPow) {
      const sA=Math.floor(en.area*0.1); en.area-=sA; myData.area+=sA;
      if(en.geometries.length>0) myData.geometries.push(en.geometries.pop());
      myData.military-=50; en.military-=100;
      if(en.area<100) {
        db.chat.push({sender:"SYSTEM", msg:`${enName}は${myName}によって併合されました`});
        myData.geometries.push(...en.geometries); delete db.nations[enName]; myData.warTarget=null;
        location.reload();
      }
    } else { myData.military-=100; }
    db.nations[enName]=en; renderWorld(db.nations);
  }

  function upgradeTech(type) {
    if(myData.money >= 100000) { myData.money-=100000; myData.tech[type]++; refreshUI(); alert("研究完了"); }
  }

  async function sendChat() {
    const inp=document.getElementById('chatInput'); if(!inp.value) return;
    const db=await getDB(); db.chat.push({sender:myName, msg:inp.value});
    await saveDB(db); inp.value="";
  }

  async function postTrade() {
    const type=document.getElementById('tradeType').value, amt=Number(document.getElementById('tradeAmt').value), pri=Number(document.getElementById('tradePrice').value);
    if(myData[type] < amt) return alert("資源不足");
    myData[type]-=amt; const db=await getDB();
    if(!db.market) db.market=[];
    db.market.push({id:Date.now(), seller:myName, type, amt, pri});
    db.nations[myName]=myData; await saveDB(db); refreshMarket();
  }

  async function buyTrade(id) {
    const db=await getDB(); const itm=db.market.find(x=>x.id===id);
    if(myData.money < itm.pri) return alert("資金不足");
    myData.money-=itm.pri; myData[itm.type]+=itm.amt;
    const seller=db.nations[itm.seller]; if(seller) seller.money+=itm.pri;
    db.market=db.market.filter(x=>x.id!==id);
    db.nations[myName]=myData; await saveDB(db); refreshMarket();
  }

  async function refreshMarket() {
    const db=await getDB(); const ml=document.getElementById('marketList');
    ml.innerHTML = (db.market||[]).map(m => `<div class="market-item"><span>${m.type}:${m.amt} ($${m.pri})</span> ${m.seller===myName?'':'<button onclick="buyTrade('+m.id+')">買</button>'}</div>`).join('');
  }

  function refreshUI() {
    document.getElementById('valMoney').innerText = Math.floor(myData.money).toLocaleString();
    document.getElementById('valArea').innerText = myData.area.toLocaleString();
    document.getElementById('valIron').innerText = myData.iron;
    document.getElementById('valOil').innerText = myData.oil;
    document.getElementById('techMil').innerText = myData.tech.mil;
    document.getElementById('techEco').innerText = myData.tech.eco;
    document.getElementById('uiName').innerText = myName;
  }

  function invest() { if(myData.money>=2000){myData.money-=2000; myData.gdp+=500; refreshUI();} }
  function recruit() { if(myData.money>=1000){myData.money-=1000; myData.military+=250; refreshUI();} }
  async function manualSave() { const db=await getDB(); db.nations[myName]=myData; await saveDB(db); alert("保存完了"); }
  function doLogout() { localStorage.clear(); location.reload(); }
  function selectTarget(n) { selectedTarget=n; document.getElementById('targetName').innerText=n; document.getElementById('btnAlly').disabled=false; document.getElementById('btnWar').disabled=false; }
  async function actionAlly() { const db=await getDB(); db.nations[selectedTarget].requests.push(myName); await saveDB(db); alert("申請済"); }
  async function actionWar() { if(confirm("宣戦布告？")){ myData.warTarget=selectedTarget; const db=await getDB(); db.chat.push({sender:"NEWS", msg:`${myName}が${selectedTarget}に宣戦布告！`}); db.nations[myName]=myData; await saveDB(db); location.reload(); } }
  
  async function attemptAdminLogin() { if(document.getElementById('adminKey').value === "201305042020302") { localStorage.setItem('adminSession','active'); document.getElementById('overlayAdminAuth').classList.add('hidden'); document.getElementById('adminPanel').classList.remove('hidden'); refreshAdminList(); } }
  async function refreshAdminList() {
    const t=document.getElementById('adminTable'); t.innerHTML="<tr><th>国</th><th>金</th><th>操作</th></tr>"; const db=await getDB();
    Object.keys(db.nations).forEach(k => { t.innerHTML += `<tr><td>${k}</td><td>${db.nations[k].money}</td><td><button onclick="del('${k}')">消</button></td></tr>`; });
  }
  async function del(n){ const db=await getDB(); delete db.nations[n]; await saveDB(db); refreshAdminList(); }

  function initFlagEditor() {
    const c=document.getElementById('flagCanvas'), ctx=c.getContext('2d');
    const pal=document.getElementById('paletteBox'); pal.innerHTML="";
    ['#000','#fff','#f00','#0f0','#00f','#ff0'].forEach(col => { const d=document.createElement('div'); d.className='color-dot'; d.style.background=col; d.onclick=()=>cur=col; pal.appendChild(d); });
    let cur="#000", dr=false;
    c.onmousedown=e=>{dr=true; drawF(e,ctx,cur);}; c.onmousemove=e=>{if(dr)drawF(e,ctx,cur);}; c.onmouseup=()=>dr=false;
  }
  function drawF(e,ctx,cur){ const r=e.target.getBoundingClientRect(); ctx.fillStyle=cur; ctx.fillRect(Math.floor((e.clientX-r.left)/10)*10, Math.floor((e.clientY-r.top)/10)*10, 10, 10); }
  async function saveFlag(){ myData.flag=document.getElementById('flagCanvas').toDataURL(); manualSave(); }
  async function updateRanking() {
    const db=await getDB(); const ranks=Object.keys(db.nations).map(k=>{ const n=db.nations[k]; return {name:k, score:Math.floor(n.gdp+(n.military*10)+(n.area/100))}; }).sort((a,b)=>b.score-a.score);
    document.getElementById('rankingList').innerHTML = ranks.slice(0,10).map((r,i)=>`<div class="rank-item">#${i+1} ${r.name} (${r.score})</div>`).join('');
  }
</script></body> </html>
